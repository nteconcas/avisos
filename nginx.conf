server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Garante que o HTML seja entregue como PÁGINA (text/html) e não como
    # texto para download/cópia, e que os acentos saiam corretos.
    charset utf-8;
    default_type text/html;

    # Evita cache do aviso (facilita atualizações futuras da página)
    add_header Cache-Control "no-cache, no-store, must-revalidate";

    # Qualquer caminho (/login, /registro, etc.) exibe a página de aviso,
    # garantindo que os favoritos antigos caiam no aviso em vez de um 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OPCIONAL: redirecionar /login direto para o novo endereço (HTTP 301),
    # sem exibir a página de aviso. Descomente o bloco abaixo para ativar:
    # location = /login {
    #     return 301 https://ponto.praticus.com.br/login;
    # }
}
