# Deploy da página de aviso (Dokploy tipo "Compose" ou docker compose direto).
# App Python (app.py) escutando em 0.0.0.0:5005 dentro do contêiner e publicado
# na porta 5005 do host, mantendo o endereço antigo acessível:
#   http://10.105.35.172:5005/login
#
# Subir/atualizar:  docker compose up -d --build
# Ver logs:         docker compose logs -f
# Derrubar:         docker compose down
services:
  aviso-ponto:
    build:
      context: .
      dockerfile: Dockerfile
    image: aviso-ponto:latest
    container_name: aviso-ponto
    environment:
      # Porta interna do app (o Dockerfile também define; aqui fica explícito)
      PORT: "5005"
      HOST: "0.0.0.0"
    # 0.0.0.0 = aceita conexão de qualquer interface da VPS (não só localhost).
    # 5005 = porta do host/VPS (pode vir da env PORTA_HOST) | 5005 = app Python.
    ports:
      - "0.0.0.0:${PORTA_HOST:-5005}:5005"
    restart: unless-stopped

